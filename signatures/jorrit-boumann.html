<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jorrit Boumann — Stateloop email signature</title>
</head>
<body>
  <div id="bar" style="font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #5c5d5e; margin: 0 0 20px; user-select: none;">
    <button id="copy" style="font: inherit; color: #1d1f20; background: #fff; border: 1px solid #d4d4d7; border-radius: 4px; padding: 7px 13px; cursor: pointer;">Copy signature</button>
    <span id="msg" style="margin-left: 10px; color: #707272;">then paste into Gmail → Settings → Signature</span>
  </div>
  <div id="signature">
  <table cellpadding="0" cellspacing="0" border="0" style="font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; color: #1d1f20; font-size: 13px; line-height: 1.5;">
    <tbody>
      <tr>
        <td style="margin: 0; padding: 0 20px 0 0; border-right: 1px solid #d4d4d7; vertical-align: middle;">
          <img src="https://stateloop.github.io/brand-assets/logos/email/STATELOOP_on_white@2x.png" alt="Stateloop" width="178" height="22" style="display: block; border: 0;">
        </td>
        <td style="margin: 0; padding: 0 0 0 20px; vertical-align: middle;">
          <div style="font-size: 14px; font-weight: 600; color: #1d1f20; line-height: 1.3;">Jorrit Boumann</div>
          <div style="font-family: &quot;SF Mono&quot;, Menlo, Monaco, Consolas, monospace; font-size: 11px; color: #5c5d5e; margin-top: 3px; letter-spacing: 0.3px;">CEO &amp; Co-founder</div>
          <div style="font-size: 12px; color: #5c5d5e; margin-top: 10px; line-height: 1.7;">
            <a href="mailto:jorrit@stateloop.ai" target="_blank" style="color: #5c5d5e; text-decoration: none;">jorrit@stateloop.ai</a><br>
            <a href="https://stateloop.ai/" target="_blank" style="color: #00619e; text-decoration: none;">stateloop.ai</a><span style="color: #d4d4d7;">&nbsp;·&nbsp;</span><span style="color: #707272;">Amsterdam, NL</span>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('copy');
      var msg = document.getElementById('msg');
      var sig = document.getElementById('signature');
      function say(t) { msg.textContent = t; }
      btn.addEventListener('click', async function () {
        var html = sig.innerHTML;
        try {
          // text/html is the whole point: a text/plain copy turns the logo
          // into the word "Stateloop".
          await navigator.clipboard.write([new ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([sig.innerText], { type: 'text/plain' })
          })]);
          say('Copied. Paste into Gmail → Settings → Signature.');
        } catch (e) {
          // Older browsers, or a denied permission: select the signature so
          // the user's own copy still carries the markup.
          var r = document.createRange();
          r.selectNodeContents(sig);
          var s = getSelection(); s.removeAllRanges(); s.addRange(r);
          say('Selected — press Ctrl+C (Cmd+C), then paste with Ctrl+V.');
        }
      });
    })();
  </script>
</body>
</html>
